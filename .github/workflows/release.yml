name: Publish version

on:
  push:
    branches: [main]
    paths: [VERSION]

permissions:
  contents: read

concurrency:
  group: publish-version

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python3 -X utf8 -m unittest discover -s tests -v
      - run: node --check web/static/app.js
  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(<VERSION)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must use major.minor.patch" >&2
            exit 1
          fi
          tag="v$version"
          if gh release view "$tag" --json url --jq .url; then
            exit 0
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "点子发芽 $tag" --notes-file CHANGELOG.md
